<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM-Plattform – Shop &amp; B2B (Demo)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>AM-Plattform</h1>
  <p class="demo">DEMO: Alle Produkte, Preise und Antworten sind Beispieldaten. Es gibt keine Bestellung und keine Zahlung.</p>
</header>
<main>
  <section>
    <h2>Beispielprodukte</h2>
    <ul id="products"></ul>
  </section>
  <section>
    <h2>B2B-Anfrage (Entwurf)</h2>
    <p>Die Anfrage wird nicht gesendet. Sie wird nur als Text angezeigt.</p>
    <form id="b2b">
      <label>Firma <input name="firma" required></label>
      <label>Anliegen <textarea name="anliegen" required></textarea></label>
      <button>Entwurf anzeigen</button>
    </form>
    <pre id="draft" hidden></pre>
  </section>
  <section>
    <h2>Demo-Assistent</h2>
    <div id="chat" aria-live="polite"></div>
    <form id="ask"><input id="q" placeholder="z. B. Klipper oder Toolchanger" required><button>Fragen</button></form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
