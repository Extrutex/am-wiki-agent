[gcode_macro DUESE_WISCHEN]
description: Wischt die Duese in mehreren Durchgaengen
variable_durchgaenge: 3
gcode:
    SAVE_GCODE_STATE NAME=wischen
    G90
    {% for i in range(durchgaenge) %}
        G1 X{20 + i * 5} F6000
        G1 X{60 + i * 5} F6000
    {% endfor %}
    RESTORE_GCODE_STATE NAME=wischen
