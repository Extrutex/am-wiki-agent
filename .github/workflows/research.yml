name: Recherche
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python am_research_builder.py
        continue-on-error: true
      # Ergebnis nur als Artefakt, kein Commit, keine Veröffentlichung.
      - uses: actions/upload-artifact@v4
        with:
          name: recherche
          path: knowledge-base/fetched/
