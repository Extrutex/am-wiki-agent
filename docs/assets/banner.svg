<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="AM-Wiki-Agent: Wiki und Chat-Agent für 3D-Druck-Firmware, jede Aussage mit Quelle">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <radialGradient id="a" cx=".18" cy=".2" r=".7"><stop offset="0" stop-color="#5eead4" stop-opacity=".22"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx=".9" cy=".9" r=".7"><stop offset="0" stop-color="#818cf8" stop-opacity=".28"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <style>
      .t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .p{animation:p 3s ease-in-out infinite}.p2{animation-delay:1s}.p3{animation-delay:2s}
      @keyframes p{50%{opacity:.25}}
      @media (prefers-reduced-motion:reduce){.p{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#07090f"/>
  <rect width="1200" height="320" rx="24" fill="url(#a)"/><rect width="1200" height="320" rx="24" fill="url(#b)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="23" fill="none" stroke="#78a0ff" stroke-opacity=".25" stroke-width="3"/>
  <g stroke="#818cf8" stroke-opacity=".35" stroke-width="1.5" fill="none">
    <path d="M760 250 840 190 930 230 1010 150 1100 200"/><path d="M840 190 880 110 960 90 1010 150"/><path d="M930 230 1000 280"/>
  </g>
  <g fill="#5eead4"><circle class="p" cx="760" cy="250" r="5"/><circle class="p p2" cx="840" cy="190" r="5"/><circle class="p p3" cx="930" cy="230" r="5"/><circle class="p" cx="1010" cy="150" r="5"/><circle class="p p2" cx="1100" cy="200" r="5"/><circle class="p p3" cx="880" cy="110" r="4"/><circle class="p" cx="960" cy="90" r="4"/><circle class="p p2" cx="1000" cy="280" r="4"/></g>
  <rect x="64" y="64" width="96" height="96" rx="22" fill="url(#g)"/>
  <text class="t" x="112" y="132" text-anchor="middle" font-size="52" font-weight="800" fill="#04121a">AM</text>
  <text class="t" x="184" y="112" font-size="54" font-weight="800" fill="#e6ebf5">Wiki-Agent</text>
  <text class="t" x="186" y="152" font-size="22" fill="#8b97b3">Das Wiki für 3D-Druck-Firmware, in dem jede Aussage eine Quelle hat.</text>
  <g class="t" font-size="18" font-weight="600">
    <rect x="64" y="212" width="190" height="40" rx="20" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".5"/><text x="159" y="238" text-anchor="middle" fill="#5eead4">Belegte Antworten</text>
    <rect x="270" y="212" width="190" height="40" rx="20" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".5"/><text x="365" y="238" text-anchor="middle" fill="#a5b0ff">Getestete Beispiele</text>
    <rect x="476" y="212" width="190" height="40" rx="20" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="571" y="238" text-anchor="middle" fill="#fbbf24">Pins gesperrt</text>
  </g>
</svg>
